name: Validación
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pruebas de backend
        run: dotnet test Eficiencia.sln --configuration Release
      - name: Instalar frontend
        run: npm ci
        working-directory: frontend
      - name: Compilar frontend
        run: npm run build
        working-directory: frontend
      - name: Verificar formato del frontend
        run: npm run format:check
        working-directory: frontend
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Prueba del flujo completo
        run: npm run test:e2e
        working-directory: frontend
      - name: Guardar evidencia en caso de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results/
